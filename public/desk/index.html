<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="面向采购团队的五功能智能分析工作台">
  <title>采策 · 智能采购助手</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./desk.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="m12 2 8 4.5v11L12 22l-8-4.5v-11L12 2Z"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="i-risk" viewBox="0 0 24 24"><path d="M12 22s7-3 7-9V6l-7-4-7 4v7c0 6 7 9 7 9Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16l4-5 3 2 5-7"/><path d="M16 6h4v4"/></symbol>
    <symbol id="i-sim" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
    <symbol id="i-gap" viewBox="0 0 24 24"><path d="m3 7 9-5 9 5v10l-9 5-9-5V7Zm0 0 9 5 9-5M12 12v10M7 4.8l9 5"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4M8 15h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
  </svg>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="采购功能导航">
      <div class="brand"><div class="brand-icon"><svg><use href="#i-logo"/></svg></div><div><div class="brand-name">采策<span> / </span>采购助手</div><p>智能采购工作台</p></div></div>
      <button class="new" id="new-chat" type="button"><svg><use href="#i-plus"/></svg>新建分析</button>
      <p class="nav-label">采购功能<span>01—05</span></p>
      <nav id="features" aria-label="选择分析功能"></nav>
      <section class="history"><p class="nav-label">本次分析<span><svg><use href="#i-clock"/></svg></span></p><div id="recent" class="recent">提交后将在这里显示运行记录</div></section>
      <div class="side-footer"><span class="side-chip"><svg><use href="#i-logo"/></svg></span><div><strong>采购决策工作台</strong><small>五项分析 · 按需运行</small></div></div>
    </aside>
    <button class="backdrop" id="backdrop" aria-label="关闭导航" hidden></button>
    <main class="main">
      <header class="topbar">
        <button class="icon-button" id="toggle-sidebar" type="button" aria-label="切换侧栏" aria-controls="sidebar"><svg><use href="#i-menu"/></svg></button>
        <div class="breadcrumb"><span>工作台</span><span class="slash">/</span><strong id="crumb">供应商风险</strong></div>
      </header>
      <div class="scroll" id="scroll">
        <div class="conversation">
          <div class="topic"><span>采购分析</span><span id="topic-id">01</span></div>
          <section class="intro">
            <div class="eyebrow"><svg><use href="#i-spark"/></svg> 采购决策助手</div>
            <h1 id="title">供应商智能推荐<span>与风险评估</span></h1>
            <p id="description">按采购单查看供应商排名、报价可用性，以及交付、质量和集中度风险。</p>
          </section>
          <div id="feed" class="feed" aria-live="polite"></div>
        </div>
      </div>
      <footer class="composer-area">
        <form id="run-form" class="composer">
          <div class="composer-header"><span class="composer-mode" id="form-title">供应商风险</span><button type="button" id="example" class="text-button">填入示例</button></div>
          <div id="fields" class="fields"></div>
          <div class="composer-bottom"><p id="form-hint">选择采购企业和产品，评估日期可留空。</p><button class="run" id="run" type="submit"><svg><use href="#i-send"/></svg><span>开始分析</span></button></div>
        </form>
        <div class="footer-note"><span class="footer-line"></span> 分析结果供采购决策参考 <span class="footer-line"></span></div>
      </footer>
    </main>
  </div>
  <section class="request-picker-overlay" id="request-picker" hidden aria-label="选择采购需求">
    <button type="button" class="request-picker-backdrop" id="request-picker-backdrop" aria-label="关闭采购需求选择弹窗"></button>
    <div class="request-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="request-picker-heading" aria-describedby="request-picker-description">
      <header class="request-picker-header">
        <div><h2 id="request-picker-heading">选择采购需求</h2><p id="request-picker-description">搜索企业或产品，也可以浏览全部采购需求</p></div>
        <button type="button" class="request-picker-close" id="request-picker-close" aria-label="关闭选择窗口">×</button>
      </header>
      <div class="request-picker-filter">
        <label for="request-picker-search" id="request-picker-search-label">搜索公司或产品</label>
        <div class="request-picker-search-row">
          <input id="request-picker-search" type="search" autocomplete="off" placeholder="例如：南京普天、贴片电阻、10kΩ" aria-controls="request-picker-options">
          <button type="button" id="request-picker-show-all" aria-label="展开全部采购需求">全部 ▾</button>
        </div>
        <p id="request-picker-count" class="request-picker-count" aria-live="polite"></p>
      </div>
      <div class="request-picker-options" id="request-picker-options" role="listbox" aria-label="采购需求列表"></div>
      <div class="request-picker-footer">选择后将自动返回分析表单；按 Esc 可以关闭窗口。</div>
    </div>
  </section>
</body>
</html>
